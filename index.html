<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D-6 Service</title>
<style>
  /* 반응형: 기본 360px 한 열(탭 위, 화면 아래) / 768px+ 탭이 가로 한 줄 / 1100px+ 왼쪽 목록 + 오른쪽 큰 화면 */
  /* 🎨 참고 사이트(eadem.co)의 색: 흰 바탕 + 따뜻한 갈색 글자 + 크림 면 + 세이지 경계선 */
  :root {
    --bg: #ffffff;          /* 페이지 바탕 */
    --cream: #f5f1ee;       /* 카드·면 */
    --ink: #7d5d24;         /* 글자·선 (흰 바탕 5.9:1, 크림 5.3:1) */
    --line: #bfbda5;        /* 옅은 경계선 */
    --on-ink: #f5f1ee;      /* 갈색 면 위 글자 (5.3:1) */
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 1rem/1.5 Pretendard, "Malgun Gothic", sans-serif;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  /* 상단 헤더: 웹사이트처럼 위에 고정, 아래 선으로 본문과 나눈다 */
  header {
    position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--ink);
    padding: clamp(.75rem, 2vw, 1.25rem) clamp(1rem, 3vw, 2rem); text-align: center;
  }
  h1 {
    margin: 0; font-weight: 700; text-transform: uppercase;
    font-size: clamp(1.75rem, 5vw, 3rem); line-height: 1.1; letter-spacing: .08em;
  }
  .layout { flex: 1; display: grid; gap: 1rem; padding: clamp(1rem, 3vw, 2rem); grid-template-columns: minmax(0, 1fr); }
  nav { display: flex; flex-direction: column; gap: .5rem; }
  nav button {
    min-height: 44px; text-align: left; padding: .7rem 1rem; cursor: pointer;
    background: var(--cream); color: var(--ink); border: 1px solid var(--ink); border-radius: 999px;
    font: inherit; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
    transition: background-color .2s, color .2s;
  }
  nav button small { display: block; font-weight: 400; text-transform: none; letter-spacing: 0; overflow-wrap: anywhere; }
  nav button:hover { background: var(--line); }
  nav button[aria-selected="true"] { background: var(--ink); color: var(--on-ink); }
  nav button:focus-visible, .open:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .stage { display: flex; flex-direction: column; gap: .5rem; min-width: 0; }
  .bar { display: flex; justify-content: flex-end; }
  .open { color: var(--ink); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; text-decoration: underline; text-underline-offset: .3em; min-height: 44px; display: inline-flex; align-items: center; }
  iframe {
    width: 100%; border: 1px solid var(--ink); border-radius: 1rem; background: #fff;
    height: min(80vh, 60rem); min-height: 28rem;
  }
  @media (prefers-reduced-motion: reduce) { nav button { transition: none; } }
  @media (min-width: 768px) {
    nav { flex-direction: row; }
    nav button { flex: 1; }
  }
  @media (min-width: 1100px) {
    .layout { grid-template-columns: minmax(14rem, 18rem) minmax(0, 1fr); }
    nav { flex-direction: column; align-self: start; }
    iframe { height: calc(100vh - 12rem); }
  }
</style>
</head>
<body>
<header>
  <h1>D-6 Service</h1>
</header>
<div class="layout">
  <nav id="tabs" role="tablist" aria-label="서비스 목록"></nav>
  <section class="stage">
    <iframe id="frame" title="선택한 서비스 화면"></iframe>
    <div class="bar">
      <a id="open" class="open" target="_blank" rel="noopener">새 탭에서 열기 ↗</a>
    </div>
  </section>
</div>
<script>
  // 🔌 브랜치별 서비스 목록: 파일 이름만 바꾸면 보이는 화면이 바뀐다
  const SERVICES = [
    { branch: "feature/weather-poster", name: "날씨 무드 포스터", file: "d6-web/weather-poster.html" },
    { branch: "feature/iss-clock",      name: "ISS 궤도 시계",    file: "d6-web/iss-clock.html" },
    { branch: "feature/cafe-location",  name: "성북구 카페 현황", file: "d6-web/cafe-location.html" }
  ];

  const tabs = document.getElementById("tabs");
  const frame = document.getElementById("frame");
  const open = document.getElementById("open");

  function show(i) {
    const s = SERVICES[i];
    frame.src = s.file;
    open.href = s.file;
    tabs.querySelectorAll("button").forEach((b, j) => b.setAttribute("aria-selected", String(i === j)));
    location.hash = s.file.replace("d6-web/", "").replace(".html", "");
  }

  SERVICES.forEach((s, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.setAttribute("role", "tab");
    b.textContent = s.name;
    b.addEventListener("click", () => show(i));
    tabs.appendChild(b);
  });

  const start = SERVICES.findIndex(s => "#" + s.file.replace("d6-web/", "").replace(".html", "") === location.hash);
  show(start < 0 ? 0 : start);
</script>
</body>
</html>
