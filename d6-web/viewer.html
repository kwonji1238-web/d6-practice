<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D6 브랜치별 서비스 보기</title>
<style>
  /* 반응형: 기본 360px 한 열(탭 위, 화면 아래) / 768px+ 탭이 가로 한 줄 / 1100px+ 왼쪽 목록 + 오른쪽 큰 화면 */
  :root {
    --bg: hsl(220 14% 10%);
    --panel: hsl(220 14% 15%);
    --line: hsl(220 10% 28%);
    --ink: hsl(0 0% 96%);
    --sub: hsl(220 10% 72%);
    --accent: hsl(165 70% 62%);
    --accent-ink: hsl(165 60% 8%);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 1rem/1.5 Pretendard, "Malgun Gothic", sans-serif;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  header { padding: 1rem clamp(1rem, 3vw, 2rem) .5rem; }
  h1 { margin: 0; font-size: clamp(1.25rem, 2.5vw, 1.75rem); }
  header p { margin: .25rem 0 0; color: var(--sub); }
  .layout { flex: 1; display: grid; gap: 1rem; padding: .5rem clamp(1rem, 3vw, 2rem) 1.5rem; grid-template-columns: minmax(0, 1fr); }
  nav { display: flex; flex-direction: column; gap: .5rem; }
  nav button {
    min-height: 44px; text-align: left; padding: .6rem .9rem; cursor: pointer;
    background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: .75rem;
    font: inherit;
  }
  nav button small { display: block; color: var(--sub); overflow-wrap: anywhere; }
  nav button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  nav button[aria-selected="true"] small { color: var(--accent-ink); }
  nav button:focus-visible, .open:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .stage { display: flex; flex-direction: column; gap: .5rem; min-width: 0; }
  .bar { display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: center; justify-content: space-between; color: var(--sub); }
  .open { color: var(--accent); min-height: 44px; display: inline-flex; align-items: center; }
  iframe {
    width: 100%; border: 1px solid var(--line); border-radius: .75rem; background: #fff;
    height: min(80vh, 60rem); min-height: 28rem;
  }
  @media (min-width: 768px) {
    nav { flex-direction: row; }
    nav button { flex: 1; }
  }
  @media (min-width: 1100px) {
    .layout { grid-template-columns: minmax(14rem, 18rem) minmax(0, 1fr); }
    nav { flex-direction: column; align-self: start; }
    iframe { height: calc(100vh - 11rem); }
  }
</style>
</head>
<body>
<header>
  <h1>D6 브랜치별 서비스 보기</h1>
  <p>브랜치를 고르면 그 브랜치에서 만든 화면이 아래에 열려요.</p>
</header>
<div class="layout">
  <nav id="tabs" role="tablist" aria-label="브랜치 목록"></nav>
  <section class="stage">
    <div class="bar">
      <span id="info"></span>
      <a id="open" class="open" target="_blank" rel="noopener">새 탭에서 열기 ↗</a>
    </div>
    <iframe id="frame" title="선택한 서비스 화면"></iframe>
  </section>
</div>
<script>
  // 🔌 브랜치별 서비스 목록: 파일 이름만 바꾸면 보이는 화면이 바뀐다
  const SERVICES = [
    { branch: "feature/weather-poster", name: "날씨 무드 포스터", file: "weather-poster.html" },
    { branch: "feature/iss-clock",      name: "ISS 궤도 시계",    file: "iss-clock.html" },
    { branch: "feature/cafe-location",  name: "성북구 카페 현황", file: "cafe-location.html" }
  ];

  const tabs = document.getElementById("tabs");
  const frame = document.getElementById("frame");
  const info = document.getElementById("info");
  const open = document.getElementById("open");

  function show(i) {
    const s = SERVICES[i];
    frame.src = s.file;
    open.href = s.file;
    info.textContent = s.branch + " · " + s.file;
    tabs.querySelectorAll("button").forEach((b, j) => b.setAttribute("aria-selected", String(i === j)));
    location.hash = s.file.replace(".html", "");
  }

  SERVICES.forEach((s, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.setAttribute("role", "tab");
    b.textContent = s.name;
    const small = document.createElement("small");
    small.textContent = s.branch;
    b.appendChild(small);
    b.addEventListener("click", () => show(i));
    tabs.appendChild(b);
  });

  const start = SERVICES.findIndex(s => "#" + s.file.replace(".html", "") === location.hash);
  show(start < 0 ? 0 : start);
</script>
</body>
</html>
