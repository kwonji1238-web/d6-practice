<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>성북구 카페 현황</title>
<style>
  :root {
    /* ── 디자인 토큰: 참고 사이트(ellipsus.com)의 색·모서리·그림자 규칙. 색은 전부 여기서만 정한다 ── */
    /* 면: 따뜻한 오프화이트 */
    --surface-primary: #f4f4f2;     /* 페이지 기본 */
    --surface-light: #f8f8f7;       /* 밝은 섹션 */
    --surface-dim: #ecece9;         /* 눌린 면, 알약 배경 */
    --surface-neutral: #ffffff;     /* 카드, 입력창 */
    --surface-inverted: #1d1e20;    /* 다크 섹션 */
    --surface-inverted-raised: #222325;   /* 다크 섹션 위의 카드 */
    --surface-error: #f1d4d0;
    /* 글자·테두리 */
    --content-primary: #282825;     /* 본문·제목 */
    --content-secondary: #64645e;   /* 보조 글자 (기본 면과 파스텔 idle 위에서 4.8:1 이상) */
    --content-disabled: #8f8f89;    /* 비활성 전용 (대비 기준 예외) */
    --content-inverted: #ffffff;
    --content-inverted-secondary: #c5c5ba;
    --border-primary: #282825;      /* 조작 요소의 테두리 */
    --border-secondary: #64645e;
    --border-tertiary: #c5c5ba;     /* 카드 같은 면 구분용 옅은 선 (장식) */
    --border-inverted: #55565e;
    --border-error: #b81a14;
    /* 버튼 */
    --button-primary-surface: #0c0d0d;
    --button-primary-surface-hover: #55565e;
    --button-primary-content: #ffffff;
    /* 카테고리 하이라이트 (idle = 기본, active = 호버·선택) */
    --hl-blue-idle: #e1edfe;   --hl-blue-active: #b8d5ff;
    --hl-purple-idle: #f6e6fc; --hl-purple-active: #edc6fb;
    --hl-orange-idle: #fdeee0; --hl-orange-active: #faca9e;
    --hl-green-idle: #e7f4eb;  --hl-green-active: #b5e3c4;
    --hl-coral-idle: #fdeeed;  --hl-coral-active: #fbc8c5;
    --hl-neutral-idle: #ecece9; --hl-neutral-active: #d6d6cf;
    --hl-yellow: #ffe81a;      /* NEW 표시 (형광펜 느낌) */
    --brand-orange: #f09236;   /* 지도 색의 바탕 */

    /* 파생 값: 새 색이 아니라 위 토큰을 섞어 만든 것 */
    --heat-low: var(--hl-orange-idle);                                                  /* 지도: 카페가 적은 동 */
    --heat-high: color-mix(in srgb, var(--brand-orange) 55%, var(--content-primary));   /* 지도: 카페가 많은 동 (진할수록 많다) */

    /* 그림자: 참고 사이트처럼 5% 알파의 옅은 다층 그림자. 깊이는 그림자 크기로만 표현 */
    --shadow-s: 0 0 12px rgb(0 0 0 / 8%);
    --shadow-m: 0 2px 14px rgb(0 0 0 / 5%), 0 2px 8px rgb(0 0 0 / 5%);
    --shadow-l: 0 0 48px rgb(0 0 0 / 5%), 0 6px 16px rgb(0 0 0 / 5%);
    --shadow-xl: 0 -7px 64px rgb(0 0 0 / 5%), 0 8px 32px rgb(0 0 0 / 6%);   /* 겹친 섹션 위쪽 */

    /* 모서리: 4 / 8 / 12 / 16, 알약은 80 */
    --radius-s: 8px;
    --radius-m: 12px;
    --radius-l: 16px;
    --radius-pill: 80px;
    --radius-sheet: 40px;

    /* 움직임: 전환은 0.3초 하나로 통일 (참고 사이트의 전환 길이) */
    --t: .3s;
    --ease: cubic-bezier(.2, .8, .2, 1);

    /* 글꼴: Roslindale(제목, 유료 세리프)과 Manrope(본문)는 이 프로젝트가 외부 글꼴을 금지해서 불러오지 않는다. 기기에 있으면 쓰이고, 없으면 뒤의 시스템 글꼴로 나온다 */
    --font-display: "Roslindale Display Narrow", "Noto Serif KR", "Nanum Myeongjo", Batang, Georgia, serif;
    --font-body: Manrope, Pretendard, "Malgun Gothic", sans-serif;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface-primary); color: var(--content-primary); font-family: var(--font-body); font-size: 1rem; font-weight: 400; line-height: 1.6; }
  :focus-visible { outline: 2px solid var(--content-primary); outline-offset: 2px; }
  button { font-family: inherit; }
  a { color: inherit; text-decoration-color: var(--border-tertiary); text-underline-offset: 3px; transition: text-decoration-color var(--t); }
  a:hover { text-decoration-color: currentColor; }

  /* 섹션: 오프화이트 → 밝은 오프화이트 → 다크. 아래 섹션이 위 섹션 위로 둥글게 겹쳐 올라온다 */
  .band { position: relative; padding: 40px 16px; }
  .inner { max-width: 760px; margin: 0 auto; }
  .band-base { background: var(--surface-primary); padding-top: 56px; padding-bottom: 72px; text-align: center; }
  .band-section { background: var(--surface-light); margin-top: -32px; padding-top: 48px; padding-bottom: 72px; border-radius: var(--radius-sheet) var(--radius-sheet) 0 0; box-shadow: var(--shadow-xl); }
  .band-promo { background: var(--surface-inverted); color: var(--content-inverted); margin-top: -32px; padding-top: 48px; padding-bottom: 56px; border-radius: var(--radius-sheet) var(--radius-sheet) 0 0; box-shadow: var(--shadow-xl); }
  .band-promo :focus-visible { outline-color: var(--content-inverted); }

  /* 제목: 얇은 세리프 디스플레이 */
  h1 { font-family: var(--font-display); font-size: clamp(2rem, 1.2rem + 4.5vw, 4.25rem); font-weight: 300; word-break: keep-all; text-wrap: balance; letter-spacing: -0.02em; line-height: 1.1; margin: 0 0 16px; }
  .src, .map-note, .count { font-size: .875rem; color: var(--content-secondary); margin: 4px 0; }
  .band-base .src { max-width: 560px; margin: 0 auto 4px; }
  .map-note { margin: 12px 4px 0; text-align: left; }
  .count { margin: 16px 0; }

  /* 성북구 전체 요약: 알약 */
  .summary {
    display: inline-block; margin: 16px 0 0; padding: 8px 20px; font-size: .9375rem; font-weight: 600;
    background: var(--hl-neutral-idle); border-radius: var(--radius-pill);
  }
  .summary:empty { display: none; }

  .map-wrap { background: var(--surface-neutral); border: 1px solid var(--border-tertiary); border-radius: var(--radius-l); padding: 20px; margin: 40px 0 0; box-shadow: var(--shadow-m); }
  svg { width: 100%; height: auto; display: block; }
  /* 동 색: 카페 수 비율(--heat 0~1)로 낮은 값~높은 값 사이를 섞는다. 숫자는 JS가 --heat로만 넘긴다 */
  .dong {
    fill: var(--heat-low); fill: color-mix(in srgb, var(--heat-high) calc(var(--heat, 0) * 100%), var(--heat-low));
    stroke: var(--surface-neutral); stroke-width: 3; stroke-linejoin: round; cursor: pointer;
    transition: stroke-width var(--t) var(--ease), filter var(--t) var(--ease);
  }
  .dong:hover { stroke: var(--content-primary); stroke-width: 3.5; filter: brightness(.96); }
  .dong:active { filter: brightness(.92); }
  .dong.sel { stroke: var(--content-primary); stroke-width: 4; }
  /* 글자는 어떤 동 색 위에서도 읽히도록 흰색 테두리를 두른다 */
  .dlabel, .dcount { fill: var(--content-primary); stroke: var(--surface-neutral); stroke-width: 3px; paint-order: stroke; stroke-linejoin: round; text-anchor: middle; pointer-events: none; }
  .dlabel { font-size: 15px; font-weight: 700; }
  .dlabel.sm { font-size: 12px; }
  .dcount { font-size: 12px; font-weight: 400; stroke-width: 2.5px; }
  .dong:focus-visible { outline: none; stroke: var(--content-primary); stroke-width: 4; }   /* 키보드로 고른 동 표시 */

  .search { display: flex; gap: 8px; margin: 0 0 4px; }
  .search input {
    flex: 1; min-width: 0; min-height: 48px; padding: 12px 22px; font: 400 1rem var(--font-body); color: var(--content-primary);
    background: var(--surface-neutral); border: 1px solid var(--border-secondary); border-radius: var(--radius-pill);
    transition: border-color var(--t) var(--ease), box-shadow var(--t) var(--ease);
  }
  .search input:focus { outline: none; border-color: var(--border-primary); box-shadow: 0 0 0 3px var(--hl-blue-active); }   /* 하이라이트 파랑 링 */
  .search input::placeholder { color: var(--content-secondary); }
  .search input:disabled { background: var(--surface-dim); border-style: dashed; border-color: var(--border-tertiary); }
  .search input:disabled::placeholder { color: var(--content-disabled); }   /* 비활성 상태는 대비 기준 예외 */

  /* 버튼: 알약형. 기본(검정)은 "더 보기" 하나, 나머지는 흰색 + 1px 잉크 테두리 */
  .search button, .more, .mode, .btn-sub {
    min-height: 44px; padding: 0 24px; border: 1px solid var(--border-primary); border-radius: var(--radius-pill); background: var(--surface-neutral); color: var(--content-primary);
    font: 600 .9375rem/1 var(--font-body); cursor: pointer;
    transition: transform var(--t) var(--ease), background-color var(--t) var(--ease), box-shadow var(--t) var(--ease), color var(--t) var(--ease);
  }
  .search button:active, .more:active, .mode:active, .btn-sub:active, .type-card:active { transform: scale(.97); }   /* 누르면 살짝 눌린다 */
  .more { display: block; width: 100%; margin: 16px 0; background: var(--button-primary-surface); border-color: var(--button-primary-surface); color: var(--button-primary-content); }
  .more[hidden] { display: none; }   /* display:block이 hidden 속성을 덮어쓰던 문제 */

  .card {
    background: var(--surface-neutral); border: 1px solid var(--border-tertiary); border-radius: var(--radius-l); padding: 20px 24px; margin: 12px 0; box-shadow: var(--shadow-s);
    transition: transform var(--t) var(--ease), box-shadow var(--t) var(--ease);
  }
  .card .name { font-family: var(--font-display); font-size: 1.5rem; font-weight: 400; letter-spacing: -0.01em; margin: 0 0 6px; line-height: 1.3; }
  .card p { margin: 2px 0; font-size: 1rem; color: var(--content-primary); }
  .error { background: var(--surface-error); color: var(--content-primary); border: 1px solid var(--border-error); border-radius: var(--radius-l); padding: 16px 22px; font-weight: 600; }
  .loading { color: var(--content-secondary); }
  .api-box { padding: 20px 24px; background: var(--surface-inverted-raised); border: 1px solid var(--border-inverted); border-radius: var(--radius-l); font-size: .875rem; word-break: break-all; }
  .band-promo .src { color: var(--content-inverted-secondary); }

  /* 보기 선택(성북구 전체 / NEW), 동 선택 */
  .filters { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin: 0 0 12px; }
  .modes { display: flex; flex-wrap: wrap; gap: 8px; }
  .mode[aria-pressed="true"] { background: var(--button-primary-surface); border-color: var(--button-primary-surface); color: var(--button-primary-content); }
  .mode:disabled { border-style: dashed; border-color: var(--border-tertiary); color: var(--content-disabled); cursor: not-allowed; }   /* 비활성은 대비 기준 예외 */
  .mode .n { font-weight: 400; margin-left: 6px; }
  .dong-pick { display: flex; align-items: center; gap: 8px; font-size: .875rem; color: var(--content-secondary); }
  .dong-pick select {
    min-height: 44px; padding: 0 18px; border: 1px solid var(--border-secondary); border-radius: var(--radius-pill); background: var(--surface-neutral); color: var(--content-primary);
    font: 400 1rem var(--font-body); cursor: pointer; transition: border-color var(--t) var(--ease), box-shadow var(--t) var(--ease);
  }
  .dong-pick select:focus { outline: none; border-color: var(--border-primary); box-shadow: 0 0 0 3px var(--hl-blue-active); }
  .dong-pick select:disabled { border-style: dashed; border-color: var(--border-tertiary); color: var(--content-disabled); cursor: not-allowed; }
  .new-note { margin: 0 0 16px; font-size: .875rem; color: var(--content-secondary); }
  .all-btn { display: block; width: 100%; margin: 0 0 16px; }
  .all-btn[hidden] { display: none; }
  .badge-new {
    display: inline-block; margin-left: 8px; padding: 2px 10px; border-radius: var(--radius-pill); background: var(--hl-yellow); color: var(--content-primary);
    font: 700 .75rem/1.5 var(--font-body); letter-spacing: .04em; vertical-align: middle;
  }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .error .btn-sub, .loading .btn-sub { margin-top: 12px; display: block; }

  /* 가게 유형 카드: 유형마다 하이라이트 색을 하나씩. 눌러서 그 유형의 가게만 목록으로 본다 */
  .sec-title { font-family: var(--font-display); font-size: clamp(1.75rem, 1.3rem + 1.6vw, 2.5rem); font-weight: 300; letter-spacing: -0.02em; line-height: 1.15; margin: 16px 0 8px; }
  h1, .sec-title, .type-card .t-name, .card .name { word-break: keep-all; }   /* 한글 단어가 중간에서 끊기지 않게 */
  .types { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 0 0 24px; padding: 0; }
  .type-card {
    --idle: var(--hl-neutral-idle); --active: var(--hl-neutral-active);
    position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-height: 44px; padding: 18px 20px; text-align: left;
    background: var(--idle); color: var(--content-primary); border: 1px solid transparent; border-radius: var(--radius-l);
    font: 400 1rem/1.4 var(--font-body); cursor: pointer;
    transition: transform var(--t) var(--ease), background-color var(--t) var(--ease), box-shadow var(--t) var(--ease), border-color var(--t) var(--ease);
  }
  .type-card[data-type="franchise"] { --idle: var(--hl-blue-idle);   --active: var(--hl-blue-active); }
  .type-card[data-type="specialty"] { --idle: var(--hl-purple-idle); --active: var(--hl-purple-active); }
  .type-card[data-type="coffee"]    { --idle: var(--hl-orange-idle); --active: var(--hl-orange-active); }
  .type-card[data-type="cafe"]      { --idle: var(--hl-green-idle);  --active: var(--hl-green-active); }
  .type-card[data-type="dessert"]   { --idle: var(--hl-coral-idle);  --active: var(--hl-coral-active); }
  .type-card .t-name { font-weight: 600; }
  .type-card .t-count { font-family: var(--font-display); font-size: 2.25rem; font-weight: 300; letter-spacing: -0.02em; line-height: 1.1; }
  .type-card .t-hint { font-size: .875rem; color: var(--content-secondary); }
  .type-card[aria-pressed="true"] { background: var(--active); border: 2px solid var(--border-primary); padding: 17px 19px; box-shadow: var(--shadow-m); }
  .type-card[aria-pressed="true"]::after { content: ""; position: absolute; top: 14px; right: 14px; width: 10px; height: 10px; border-radius: 50%; background: var(--content-primary); }   /* 선택 표시(색에만 의존하지 않도록 점 + 굵은 테두리) */
  .type-card[aria-pressed="true"] .t-hint { color: var(--content-primary); }   /* 진한 하이라이트 위에서는 보조 글자색 대비가 4.0:1이라 잉크색 */
  .type-card:disabled { background: var(--surface-dim); border: 1px dashed var(--border-tertiary); cursor: not-allowed; }
  .type-card:disabled .t-name, .type-card:disabled .t-count, .type-card:disabled .t-hint { color: var(--content-disabled); }   /* 비활성(0곳)은 대비 기준 예외 */

  /* 마우스가 있는 기기에서만 호버 효과 (터치에서 호버가 남아 있는 문제를 막는다) */
  @media (hover: hover) {
    .search button:hover, .mode:hover, .btn-sub:hover { background: var(--surface-dim); }
    .mode[aria-pressed="true"]:hover, .more:hover { background: var(--button-primary-surface-hover); border-color: var(--button-primary-surface-hover); }
    .mode:disabled:hover { background: var(--surface-neutral); }
    .card:hover { transform: translateY(-3px); box-shadow: var(--shadow-l); }
    .type-card:not(:disabled):hover { transform: translateY(-4px); background: var(--active); box-shadow: var(--shadow-m); }
    .type-card:not(:disabled):hover .t-hint { color: var(--content-primary); }
    .dong-pick select:not(:disabled):hover, .search input:not(:disabled):hover { border-color: var(--border-primary); }
  }

  /* 움직임: 줄이기를 켜지 않은 경우에만. 목록 카드는 앞의 8장만 차례로 떠오르게 해서 긴 목록에서도 가볍게 */
  @media (prefers-reduced-motion: no-preference) {
    html { scroll-behavior: smooth; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    .card:nth-child(-n+8) { animation: rise .5s var(--ease) both; }
    .card:nth-child(2) { animation-delay: .04s; } .card:nth-child(3) { animation-delay: .08s; } .card:nth-child(4) { animation-delay: .12s; }
    .card:nth-child(5) { animation-delay: .16s; } .card:nth-child(6) { animation-delay: .2s; } .card:nth-child(7) { animation-delay: .24s; } .card:nth-child(8) { animation-delay: .28s; }
    .band-base .inner { animation: rise .6s var(--ease) both; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
    .card:hover, .type-card:hover { transform: none !important; }
  }
</style>
</head>
<body>
<section class="band band-base"><div class="inner">
<h1>☕ 성북구 카페 현황</h1>
<p class="src">출처: 공공데이터포털(data.go.kr) 서울특별시 성북구 카페 현황 · 제공 기관이 갱신한 시점의 자료이며 실시간이 아닙니다.</p>
<p class="summary" id="summary"></p>

<div class="map-wrap">
  <svg id="map" viewBox="0 0 600 440" role="group" aria-label="성북구 동네별 카페 수 지도 일러스트. 동을 눌러 그 동네만 볼 수 있어요"></svg>
  <p class="map-note">※ 동 위치를 보기 쉽게 그린 개략도라 실제 경계·면적과 다릅니다. 법정동 기준이며 진할수록 카페가 많습니다. 동을 누르면 그 동네만 보입니다.</p>
</div>
</div></section>

<section class="band band-section"><div class="inner">
<div class="filters">
  <div class="modes" role="group" aria-label="보기 선택">
    <button type="button" class="mode" id="mode-all" aria-pressed="true" disabled>성북구 전체<span class="n" id="n-all"></span></button>
    <button type="button" class="mode" id="mode-new" aria-pressed="false" disabled>NEW<span class="n" id="n-new"></span></button>
  </div>
  <label class="dong-pick">동 선택
    <select id="dongSel" disabled><option value="">성북구 전체 동</option></select>
  </label>
</div>
<p class="new-note" id="newNote"></p>

<h2 class="sec-title">가게 유형</h2>
<p class="new-note" id="typeNote"></p>
<div class="types" id="types" role="group" aria-label="가게 유형 선택"></div>

<div class="search">
  <input id="q" type="search" placeholder="카페 이름이나 주소로 검색" aria-label="카페 이름이나 주소로 검색" autocomplete="off" disabled>
  <button id="reset" type="button" hidden>전체 보기</button>
</div>
<div class="count" id="count" role="status" aria-live="polite"></div>
<div id="list" class="loading">불러오는 중…</div>
<button id="more" class="more" type="button" hidden>더 보기</button>
<button id="showAll" class="btn-sub all-btn" type="button" hidden>모두 보기</button>
</div></section>

<section class="band band-promo"><div class="inner">
<div class="api-box">
  <b>🔌 이 화면이 쓰는 API</b>
  <div id="apiUrl">(호출 전)</div>
  <div class="src">※ 인증키는 화면에 표시하지 않습니다.</div>
</div>
</div></section>

<!-- 🔑 인증키는 별도 파일(cafe-location.api.js)에 있다. 이 파일에는 키가 없다. -->
<script src="cafe-location.api.js"></script>
<script>
// 🔌 API 주소는 cafe-location.api.js의 ENDPOINT, 키는 SERVICE_KEY. 그 외 요청 조건만 여기에 모은다.
const API = {
  endpoint: KEYS.ENDPOINT,          // 🔌
  params: { page: 1, perPage: 2000 }, // 🔌 odcloud 방식 (기본 10건이라 크게 요청)
};

// 동네 그림: 법정동 이름 → 지도 도형 (개략도). 응답의 지번 주소에서 동 이름을 뽑아 연결한다.
const DONGS = {
  "정릉동":   { d: "M40,60 L240,30 L270,160 L200,200 L60,170 Z", x: 150, y: 110 },
  "길음동":   { d: "M240,30 L380,50 L390,150 L270,160 Z", x: 320, y: 100 },
  "장위동":   { d: "M380,50 L560,70 L540,200 L450,210 L420,150 L390,150 Z", x: 480, y: 125 },
  "하월곡동": { d: "M270,160 L390,150 L400,230 L290,240 Z", x: 335, y: 200 },
  "상월곡동": { d: "M390,150 L420,150 L450,210 L470,250 L400,230 Z", x: 432, y: 205, sm: true },
  "석관동":   { d: "M450,210 L540,200 L560,330 L480,340 L470,250 Z", x: 510, y: 275 },
  "종암동":   { d: "M290,240 L400,230 L470,250 L480,340 L380,330 L300,310 Z", x: 390, y: 285 },
  "돈암동":   { d: "M200,200 L270,160 L290,240 L300,310 L230,340 L170,310 L160,230 Z", x: 232, y: 265 },
  "성북동":   { d: "M60,170 L200,200 L160,230 L170,310 L100,300 L40,260 Z", x: 112, y: 245 },
  "동소문동": { d: "M40,260 L100,300 L90,360 L30,340 Z", x: 62, y: 315, sm: true },
  "삼선동":   { d: "M100,300 L170,310 L160,370 L110,410 L90,360 Z", x: 132, y: 345 },
  "동선동":   { d: "M170,310 L230,340 L240,380 L160,370 Z", x: 200, y: 350 },
  "안암동":   { d: "M230,340 L300,310 L380,330 L370,420 L260,410 L240,380 Z", x: 310, y: 372 },
  "보문동":   { d: "M160,370 L240,380 L260,410 L170,430 L110,410 Z", x: 190, y: 408 },
};

const listEl = document.getElementById("list");
const countEl = document.getElementById("count");
const qEl = document.getElementById("q");
const moreEl = document.getElementById("more");
const resetEl = document.getElementById("reset");
const PAGE = 50;
// NEW: 공공데이터에 개업일이 없어서, 등록 순서로 보이는 연번이 가장 큰 N곳을 "최근 등록 추정"으로 표시한다 (확정된 개업일이 아니다)
const NEW_COUNT = 50;
const dongSelEl = document.getElementById("dongSel");
const modeAllEl = document.getElementById("mode-all");
const modeNewEl = document.getElementById("mode-new");
const showAllEl = document.getElementById("showAll");
let rows = [];
let selDong = null;
let mode = "all"; // "all" 성북구 전체 | "new" NEW만
let selType = null; // 선택한 가게 유형 key (없으면 전체)

// 가게 유형: 공공데이터에 메뉴·주문 정보가 없어서 업소명만으로 나눈다 (위에서부터 먼저 맞는 한 유형에만 들어가므로 합계가 전체와 같다)
const TYPES = [
  { key: "franchise", label: "프랜차이즈 커피", hint: "스타벅스·이디야·투썸 같은 커피 브랜드 이름이 들어간 가게",
    re: /스타벅스|이디야|투썸|메가\s*(?:MGC|엠지씨|커피)|컴포즈|빽다방|할리스|엔제리너스|탐앤|커피빈|파스쿠찌|매머드|더벤티|폴바셋|블루보틀|카페베네/i },
  { key: "specialty", label: "원두·드립", hint: "이름에 로스터리·드립·브루·에스프레소·라떼가 들어간 가게",
    re: /로스터|로스팅|드립|브루(?!어)|에스프레소|라떼|라테(?!라스)|roaster|roasting|espresso|latte|brew(?!ery)/i },
  { key: "coffee", label: "커피집", hint: "이름에 '커피'가 들어간 가게", re: /커피|coffee/i },
  { key: "cafe", label: "카페", hint: "이름에 '카페'가 들어간 가게", re: /카페|cafe/i },
  { key: "dessert", label: "디저트·베이커리", hint: "이름에 디저트·빵·케이크·와플·도넛 등이 들어간 가게",
    re: /디저트|베이커리|제과|빵|케이크|도넛|도너츠|마카롱|와플|크로플|bakery/i },
  { key: "drink", label: "차·음료", hint: "이름에 티·주스·스무디·요거트·빙수 등이 들어간 가게",
    re: /\btea\b|티룸|티하우스|밀크티|버블티|아이스티|공차|주스|쥬스|스무디|요거|생과일|빙수/i },
];
const OTHER_TYPE = { key: "other", label: "그 외", hint: "이름만으로는 커피·카페인지 알 수 없는 가게 (편의점·분식 등 포함)" };
const typeOf = r => (TYPES.find(t => t.re.test(String(r["업소명"] || ""))) || OTHER_TYPE).key;
const typeLabel = key => ([...TYPES, OTHER_TYPE].find(t => t.key === key) || {}).label || "";
let shown = PAGE;

function actionButton(label, onClick) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "btn-sub";
  b.textContent = label;
  b.addEventListener("click", onClick);
  return b;
}

function showError(reason) {
  listEl.className = "error";
  listEl.textContent = "사용 오류: " + reason;
  listEl.appendChild(actionButton("다시 시도", () => { listEl.className = "loading"; listEl.textContent = "불러오는 중…"; load(); }));
  countEl.textContent = "";
}

// 응답 안에서 객체 배열을 찾는다 (data.go.kr 응답 구조가 API마다 달라서)
function findRows(node) {
  if (Array.isArray(node)) return node.length && typeof node[0] === "object" ? node : null;
  if (node && typeof node === "object") {
    for (const v of Object.values(node)) { const r = findRows(v); if (r) return r; }
  }
  return null;
}

// "성북구 보문동4가 78-4" → "보문동", 지번이 없으면 도로명 끝 괄호 "(보문동4가)"에서 뽑는다
function dongOf(r) {
  const m = (r["소재지(지번)"] || "").match(/성북구\s*([가-힣]+?)(?:\d+가)?(?:\s|$)/)
         || (r["소재지(도로명)"] || "").match(/\(([가-힣]+?)(?:\d+가)?[,)]/);
  return m ? m[1] : "";
}

// 지금 보기(성북구 전체 / NEW)에 해당하는 카페
function modeRows() { return rows.filter(r => (mode !== "new" || r._new) && (!selType || r._type === selType)); }

function syncMode() {
  modeAllEl.setAttribute("aria-pressed", String(mode === "all"));
  modeNewEl.setAttribute("aria-pressed", String(mode === "new"));
}

function setMode(m) { mode = m; syncMode(); shown = PAGE; drawMap(); render(); }

// 동 고르기: 지도 클릭, 키보드(Enter/Space), 동 선택 목록이 모두 이 함수를 쓴다
function pickDong(name, focusName) {
  selDong = name || null;
  shown = PAGE;
  dongSelEl.value = selDong || "";
  drawMap();
  render();
  if (focusName) { const p = document.querySelector('#map [data-name="' + focusName + '"]'); if (p) p.focus(); } // 지도를 다시 그려도 키보드 위치 유지
}

// 유형 카드: 한 번 더 누르면 해제. 목록이 화면 아래쪽에 있으면 그리로 내려간다
function setType(key) {
  selType = selType === key ? null : key;
  shown = PAGE;
  drawMap();
  render();
  if (selType && countEl.getBoundingClientRect().top > window.innerHeight * 0.6) {
    countEl.scrollIntoView({ block: "start", behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  }
}

function resetAll() {
  qEl.value = ""; selDong = null; selType = null; mode = "all"; shown = PAGE;
  dongSelEl.value = "";
  syncMode(); drawMap(); render();
}

function drawMap() {
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("map");
  svg.replaceChildren();
  const counts = {};
  modeRows().forEach(r => { counts[r._dong] = (counts[r._dong] || 0) + 1; });
  const max = Math.max(1, ...Object.values(counts));
  for (const [name, g] of Object.entries(DONGS)) {
    const n = counts[name] || 0;
    const on = name === selDong;
    const path = document.createElementNS(NS, "path");
    path.setAttribute("d", g.d);
    path.setAttribute("class", "dong" + (on ? " sel" : ""));
    path.style.setProperty("--heat", (n / max).toFixed(3)); // 색은 CSS 토큰(--heat-low ~ --heat-high)이 정한다
    path.setAttribute("data-name", name);
    path.setAttribute("tabindex", "0");
    path.setAttribute("role", "button");
    path.setAttribute("aria-pressed", String(on));
    path.setAttribute("aria-label", name + " " + n + "곳");
    path.addEventListener("click", () => pickDong(on ? null : name));
    path.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pickDong(on ? null : name, name); } });
    const title = document.createElementNS(NS, "title");
    title.textContent = name + " " + n + "곳";
    path.appendChild(title);
    const label = document.createElementNS(NS, "text");
    label.setAttribute("x", g.x); label.setAttribute("y", g.y);
    label.setAttribute("class", "dlabel" + (g.sm ? " sm" : ""));
    label.textContent = name;
    const cnt = document.createElementNS(NS, "text");
    cnt.setAttribute("x", g.x); cnt.setAttribute("y", g.y + 16);
    cnt.setAttribute("class", "dcount");
    cnt.textContent = n + "곳";
    svg.append(path, label, cnt);
  }
}

function render() {
  const f = qEl.value.trim();
  const pool = modeRows();
  const hit = pool.filter(r =>
    (!selDong || r._dong === selDong) &&
    (!f || String(r["업소명"]).includes(f) || String(r["소재지(도로명)"]).includes(f) || String(r["소재지(지번)"]).includes(f)));
  if (mode === "new") hit.sort((a, b) => b._no - a._no); // 최근 등록 추정이 위로
  updateTypeCards(f);
  listEl.className = "";
  listEl.replaceChildren();
  hit.slice(0, shown).forEach(r => {
    const card = document.createElement("div");
    card.className = "card";
    const name = document.createElement("h2");
    name.className = "name";
    name.textContent = String(r["업소명"] || "(이름 없음)");
    if (r._new) {
      const badge = document.createElement("span");
      badge.className = "badge-new";
      badge.textContent = "NEW";
      const hint = document.createElement("span");
      hint.className = "sr-only";
      hint.textContent = " (최근 등록 추정)";
      name.append(badge, hint);
    }
    const addr = document.createElement("p");
    addr.textContent = "📍 " + String(r["소재지(도로명)"] || r["소재지(지번)"] || "주소 없음");
    card.append(name, addr);
    if (r["건물내부면적"]) {
      const a = document.createElement("p");
      a.textContent = "건물 내부 면적 " + r["건물내부면적"] + "㎡";
      card.appendChild(a);
    }
    listEl.appendChild(card);
  });
  if (!hit.length) {
    listEl.className = "loading";
    listEl.textContent = "조건에 맞는 카페가 없어요.";
    listEl.appendChild(actionButton("필터 초기화", resetAll));
  }
  const where = selDong ? selDong + " · " : "";
  const poolName = (mode === "new" ? "NEW " : "") + (selType ? typeLabel(selType) : "전체");
  countEl.textContent = (mode === "new" ? "NEW · " : "") + (selType ? typeLabel(selType) + " · " : "") + where + hit.length.toLocaleString("ko-KR") + "곳 / " + poolName + " " + pool.length.toLocaleString("ko-KR") + "곳";
  moreEl.hidden = hit.length <= shown;
  showAllEl.hidden = hit.length <= shown;
  showAllEl.textContent = "모두 보기 (" + hit.length.toLocaleString("ko-KR") + "곳)";
  resetEl.hidden = !selDong && !f && !selType && mode === "all";
}

// 유형 카드의 개수: 보기·동·검색은 그대로 두고 유형만 빼서 센다 (카드를 누르면 나오는 개수와 같다)
function updateTypeCards(f) {
  const facet = {};
  rows.forEach(r => {
    if ((mode !== "new" || r._new) && (!selDong || r._dong === selDong) &&
        (!f || String(r["업소명"]).includes(f) || String(r["소재지(도로명)"]).includes(f) || String(r["소재지(지번)"]).includes(f))) {
      facet[r._type] = (facet[r._type] || 0) + 1;
    }
  });
  document.querySelectorAll("#types .type-card").forEach(btn => {
    const key = btn.dataset.type, n = facet[key] || 0, on = key === selType;
    btn.querySelector(".t-count").textContent = n.toLocaleString("ko-KR") + "곳";
    btn.setAttribute("aria-pressed", String(on));
    btn.disabled = n === 0 && !on;
  });
}

// 불러온 뒤 한 번: 컨트롤 켜기, 성북구 전체 요약, 동 선택 목록
function initControls(numbered) {
  const counts = {};
  rows.forEach(r => { counts[r._dong] = (counts[r._dong] || 0) + 1; });
  qEl.disabled = false; dongSelEl.disabled = false; modeAllEl.disabled = false;
  document.getElementById("n-all").textContent = rows.length.toLocaleString("ko-KR");
  for (const name of Object.keys(DONGS)) {
    const o = document.createElement("option");
    o.value = name;
    o.textContent = name + " (" + (counts[name] || 0) + "곳)";
    dongSelEl.appendChild(o);
  }
  const top = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
  document.getElementById("summary").textContent = "성북구 전체 " + rows.length.toLocaleString("ko-KR") + "곳 · " + Object.keys(counts).length + "개 동" + (top ? " · " + top[0] + " " + top[1] + "곳으로 가장 많아요" : "");
  const typesEl = document.getElementById("types");
  for (const t of [...TYPES, OTHER_TYPE]) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "type-card";
    b.dataset.type = t.key;
    b.setAttribute("aria-pressed", "false");
    const nm = document.createElement("span"); nm.className = "t-name"; nm.textContent = t.label;
    const ct = document.createElement("span"); ct.className = "t-count"; ct.textContent = "0곳";
    const ht = document.createElement("span"); ht.className = "t-hint"; ht.textContent = t.hint;
    b.append(nm, ct, ht);
    b.addEventListener("click", () => setType(t.key));
    typesEl.appendChild(b);
  }
  document.getElementById("typeNote").textContent = "※ 공공데이터에 메뉴·주문 정보가 없어서, 업소명으로 나눈 분류예요. 정확하지 않을 수 있고 한 가게는 한 유형에만 들어가요. '주문 많은 순'은 알 수 없어요.";
  const note = document.getElementById("newNote");
  if (numbered) {
    modeNewEl.disabled = false;
    document.getElementById("n-new").textContent = Math.min(NEW_COUNT, rows.length);
    note.textContent = "※ 공공데이터에 개업일이 없어서, 등록 번호(연번)가 가장 큰 " + Math.min(NEW_COUNT, rows.length) + "곳을 NEW(최근 등록 추정)로 표시해요. 실제 개업일과 다를 수 있어요.";
  } else {
    note.textContent = "※ 응답에 연번 값이 없어 NEW를 표시할 수 없어요.";
  }
}

async function load() {
  if (!KEYS.ENDPOINT || KEYS.ENDPOINT.startsWith("여기에") || KEYS.SERVICE_KEY.startsWith("여기에")) {
    return showError("cafe-location.api.js에 인증키와 요청주소를 넣어 주세요.");
  }
  const url = new URL(API.endpoint);
  Object.entries(API.params).forEach(([k, v]) => url.searchParams.set(k, v));
  document.getElementById("apiUrl").textContent = url.href; // 키 붙이기 전 주소만 표시
  url.searchParams.set("serviceKey", KEYS.SERVICE_KEY);
  try {
    const res = await fetch(url); // 🔌 API 호출
    if (!res.ok) return showError("HTTP 오류 " + res.status);
    const text = await res.text();
    let json;
    try { json = JSON.parse(text); } catch { return showError("JSON이 아닌 응답입니다 (인증키·요청주소 확인): " + text.slice(0, 120)); }
    rows = findRows(json) || [];
    if (!rows.length) return showError("값 없음 (응답에 목록이 없습니다)");
    rows.forEach(r => { r._dong = dongOf(r); r._no = Number(r["연번"]); r._type = typeOf(r); });
    const numbered = rows.every(r => Number.isFinite(r._no));
    if (numbered) [...rows].sort((a, b) => b._no - a._no).slice(0, NEW_COUNT).forEach(r => { r._new = true; });
    initControls(numbered);
    drawMap();
    render();
  } catch (e) {
    showError("호출 실패 (" + e.message + ") — 네트워크 또는 CORS 차단일 수 있어요");
  }
}
qEl.addEventListener("input", () => { shown = PAGE; render(); });
moreEl.addEventListener("click", () => { shown += PAGE; render(); });
showAllEl.addEventListener("click", () => { shown = Infinity; render(); });
resetEl.addEventListener("click", resetAll);
modeAllEl.addEventListener("click", () => setMode("all"));
modeNewEl.addEventListener("click", () => setMode("new"));
dongSelEl.addEventListener("change", () => pickDong(dongSelEl.value || null));
load();
</script>
</body>
</html>
